apiVersion: v1
kind: Service
metadata:
  name: support
  namespace: shoppal
spec:
  selector:
    app: support
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: support
  namespace: shoppal
  labels:
    app: support
spec:
  replicas: 2
  selector:
    matchLabels:
      app: support
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: support
    spec:
      containers:
        - name: support
          image: ghcr.io/shoppal/support:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shoppal-secret
                  key: SUPPORT_DATABASE_URL
            - name: NOTIFICATIONS_URL
              valueFrom:
                configMapKeyRef:
                  name: shoppal-config
                  key: NOTIFICATIONS_URL
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: shoppal-config
                  key: SUPPORT_ALLOWED_ORIGINS
            - name: ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: support
  namespace: shoppal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: support
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
