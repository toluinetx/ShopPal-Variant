# Placeholder secret. In production, create secrets via `kubectl create secret`
# or a secret manager (Vault, External Secrets Operator, SOPS-encrypted git).
# The base64 values below are literal placeholders and must be replaced.
apiVersion: v1
kind: Secret
metadata:
  name: shoppal-secret
  namespace: shoppal
type: Opaque
stringData:
  DB_USER: "shoppal"
  DB_PASSWORD: "change-me"
  JWT_SECRET: "change-me"
  # postgres URL used by the Go support service
  SUPPORT_DATABASE_URL: "postgres://shoppal:change-me@postgres:5432/shoppal?sslmode=disable"
