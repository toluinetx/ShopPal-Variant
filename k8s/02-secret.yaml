# Placeholder secret. In production, create secrets via `kubectl create secret`
# or a secret manager (Vault, External Secrets Operator, SOPS-encrypted git).
# The values below are literal placeholders and must be replaced.
#
# DB_CONNECTION_URL and SUPPORT_DATABASE_URL both derive from DB_USER /
# DB_PASSWORD below — keep all three in sync if you change credentials.
apiVersion: v1
kind: Secret
metadata:
  name: shoppal-secret
  namespace: shoppal
type: Opaque
stringData:
  DB_USER: "shoppal"
  DB_PASSWORD: "change-me"
  JWT_SECRET: "change-me"

  # Connection string used by the Node `server` API (TypeORM).
  DB_CONNECTION_URL: "postgres://shoppal:change-me@postgres:5432/shoppal"

  # Connection string used by the Go `support` service (pgx).
  SUPPORT_DATABASE_URL: "postgres://shoppal:change-me@postgres:5432/shoppal?sslmode=disable"
