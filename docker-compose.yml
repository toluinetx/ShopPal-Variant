services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shoppal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shoppal}
      POSTGRES_DB: ${POSTGRES_DB:-shoppal}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied once, only when the data directory is empty (official
      # postgres image convention). support/notifications self-migrate
      # on boot; the core `server` API has no migration tooling of its
      # own, so its schema is bootstrapped here.
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Default admin login for the `admin` frontend (admin / Admin123!,
      # see server/db/seed-admin.sql) — same once-only bootstrap as above.
      - ./server/db/seed-admin.sql:/docker-entrypoint-initdb.d/02-seed-admin.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  notifications:
    build:
      context: ./notifications
    restart: unless-stopped
    environment:
      PORT: "8082"
      MAX_EVENTS: "1000"
    ports:
      - "${NOTIFICATIONS_PORT:-8085}:8082"

  support:
    build:
      context: ./support
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      notifications:
        condition: service_started
    environment:
      PORT: "8081"
      DATABASE_URL: "postgres://${POSTGRES_USER:-shoppal}:${POSTGRES_PASSWORD:-shoppal}@postgres:5432/${POSTGRES_DB:-shoppal}?sslmode=disable"
      NOTIFICATIONS_URL: "http://notifications:8082"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8087}"
      ENV: "${NODE_ENV:-development}"
    ports:
      - "${SUPPORT_PORT:-8086}:8081"

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      notifications:
        condition: service_started
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      DB_CONNECTION_URL: "postgres://${POSTGRES_USER:-shoppal}:${POSTGRES_PASSWORD:-shoppal}@postgres:5432/${POSTGRES_DB:-shoppal}"
      CLIENT_PROD_URL: "${CLIENT_PROD_URL:-http://localhost:8087}"
      ADMIN_PROD_URL: "${ADMIN_PROD_URL:-http://localhost:8090}"
      JWT_SECRET: "${JWT_SECRET:-change-me-dev-only-not-for-prod}"
      JWT_ACCESS_TOKEN_LENGTH: "${JWT_ACCESS_TOKEN_LENGTH:-15m}"
      JWT_REFRESH_TOKEN_LENGTH: "${JWT_REFRESH_TOKEN_LENGTH:-7d}"
      COOKIE_REFRESH_TOKEN_NAME: "${COOKIE_REFRESH_TOKEN_NAME:-refreshToken}"
      COOKIE_REFRESH_TOKEN_AGE: "${COOKIE_REFRESH_TOKEN_AGE:-604800000}"
      BCRYPT_HASH_LENGTH: "${BCRYPT_HASH_LENGTH:-10}"
      NOTIFICATIONS_URL: "http://notifications:8082"
    ports:
      - "${SERVER_PORT:-3000}:3000"

  client:
    build:
      context: ./client
      args:
        VITE_SERVER_URL: "http://localhost:${SERVER_PORT:-3000}"
        VITE_SUPPORT_URL: "http://localhost:${SUPPORT_PORT:-8086}"
    restart: unless-stopped
    depends_on:
      - server
      - support
    ports:
      - "${CLIENT_PORT:-8087}:80"

  admin:
    build:
      context: ./admin
      args:
        VITE_SERVER_URL: "http://localhost:${SERVER_PORT:-3000}"
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${ADMIN_PORT:-8090}:80"

volumes:
  pgdata:
